<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js"></script>
</head>
<style>
    .vrchne {
        height: 250px;
        flex: 1;
        background-color: white;
        border-radius: 5px;
        cursor: pointer;
    }

    .vrchne:hover {
        transform: scale(0.98);
        cursor: pointer;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.45);
        transition: 0.3s ease;
    }

    .obraztek {
        height: 250px;
        width: 450px;
        object-fit: contain;
        margin: auto;
        display: flex;
        flex-direction: column;
    }





    .obraztekrock {
        height: 250px;
        width: 450px;
        object-fit: fill;
        margin: auto;
        display: flex;
        flex-direction: column;
    }

    .spodne {
        margin: auto;
        height: 100px;
        width: 400px;
        background-color: rgb(219, 219, 219);
        margin-top: 20px;
        border-radius: 20px;
        border: 5px gray solid;
    }

    .spodne_reset {
        margin: auto;
        height: 100px;
        width: 200px;
        background-color: rgb(219, 219, 219);
        margin-top: 20px;
        border-radius: 20px;
        border: 5px gray solid;
    }


    .spodne_reset:hover {
        transform: scale(0.98);
        cursor: pointer;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.45);
        transition: 0.3s ease;
    }

    h1 {
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        font-size: 55px;
        margin: 0;
        text-align: center;
    }

    p {
        font-family: 'Courier New', Courier, monospace;
        margin-top: 5px;
        font-size: 30px;
        margin: 0;
        text-align: center;
    }

    .result-text {
        font-family: 'Courier New', Courier, monospace;
        margin-top: 25px;
        font-size: 58px;
        margin-top: 17px;
        text-align: center;
    }

    .choice {
        height: 375px;
        width: 300px;
        object-fit: contain;
        display: flex;
        flex-direction: row;
        margin: auto;
        text-align: center;
        margin-left: 25.4%;
        font-size: 30px;
    }
</style>

<body>
    <div style="width: auto;display: flex;">
        <button class="vrchne" onclick="playGame('rock')">
            <img class="obraztekrock"
                src="https://clipart-library.com/new_gallery/42-420480_dwayne-the-rock-the-rock-dwayne-johnson-rock.png"
                alt="">

        </button>
        <button class="vrchne " onclick="playGame('paper')">
            <img class="obraztek" src="https://static.wikia.nocookie.net/shivaxis-rlcraft/images/b/b2/Paper.png" alt="">

        </button>
        <button class="vrchne" onclick="playGame('scissors')">
            <img class="obraztek"
                src="https://static.wikia.nocookie.net/minecraft_gamepedia/images/5/5a/Shears_JE2_BE2.png" alt="">
        </button>
    </div>







    <div
        style="margin: auto;padding-top: 45px;height: 430px;width: auto;background-color: rgb(229, 229, 229);margin-top: 20px;">
        <div class="choice" id="choices"></div>
    </div>








    <div style="width: auto;display: flex;">
        <div class="spodne">
            <b>
                <p>Moje skóre</p>
            </b>
            <h1>
                <div class="score-value" id="playerScore">0</div>
            </h1>
        </div>


        <div class="spodne">

            <b>
                <div class="result-text" id="result"></div>
            </b>
        </div>


        <div class="spodne">
            <b>
                <p>Protihráčove skóre</p>
            </b>
            <h1>
                <div class="score-value" id="computerScore">0</div>
            </h1>
        </div>

        <button class="spodne_reset" onclick="resetGame">
            <b>
                <p>RESET</p>
            </b>

    </div>

    </div>

</body>

</html>
